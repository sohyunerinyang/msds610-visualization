[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-eda-syang120"
version = "0.3.0"
description = "Tiny pandas EDA helpers plus styled matplotlib charts"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sohyun Yang" }]
dependencies = ["pandas", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
