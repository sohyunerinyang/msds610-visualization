[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-eda-syang120"
version = "0.1.0"
description = "A handful of pandas-based exploratory data analysis helpers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sohyun Yang" }]
dependencies = ["pandas"]

[tool.setuptools.packages.find]
include = ["simple_eda*"]
